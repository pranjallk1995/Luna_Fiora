services:
  mcp:
    build: ./mcp
    image: ghcr.io/pranjallk1995/luna-fiora-mcp:latest
    working_dir: /workspace/mcp
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:?Set LUNA_SSO_URL to Luna Sentia's public sign-on address}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:18003}
      DATABASE_URL: postgresql://lunafiora:${POSTGRES_PASSWORD:-lunafiora-dev}@luna-sentia-db:5432/lunafiora
      LUNAFIORA_API_TOKEN: ${LUNAFIORA_API_TOKEN:?Set LUNAFIORA_API_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL:-http://luna-sentia-ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b-instruct}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_POLL_MINUTES: ${GMAIL_POLL_MINUTES:-15}
      TZ: Asia/Kolkata
    ports: ["127.0.0.1:18003:8000"]
    develop:
      watch:
        - action: sync+restart
          path: ./mcp/app
          target: /workspace/mcp/app
          ignore:
            - __pycache__/
            - "*.py[cod]"
        - action: rebuild
          path: ./mcp/requirements.txt
        - action: rebuild
          path: ./mcp/Dockerfile
    networks:
      sentia_network:
        aliases: [luna-fiora-mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    image: ghcr.io/pranjallk1995/luna-fiora-ui:latest
    working_dir: /workspace/ui
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:?Set LUNA_SSO_URL to Luna Sentia's public sign-on address}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      LUNAFIORA_API_URL: http://luna-fiora-mcp:8000
      LUNAFIORA_API_TOKEN: ${LUNAFIORA_API_TOKEN:?Set LUNAFIORA_API_TOKEN}
      LUNAFIORA_ALLOWED_EMAILS: ${LUNAFIORA_ALLOWED_EMAILS:?Set LUNAFIORA_ALLOWED_EMAILS}
      TZ: Asia/Kolkata
    ports: ["127.0.0.1:18504:8501"]
    develop:
      watch:
        # The gateway restarts on Python changes; the browser app is built into the image.
        - action: sync+restart
          path: ./ui
          target: /workspace/ui
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - .pytest_cache/
            - requirements.txt
            - Dockerfile
            - web/
        - action: rebuild
          path: ./ui/web/src
        - action: rebuild
          path: ./ui/web/package.json
        - action: rebuild
          path: ./ui/requirements.txt
        - action: rebuild
          path: ./ui/Dockerfile
    networks:
      sentia_network:
        aliases: [luna-fiora-ui]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mcp:
        condition: service_healthy

networks:
  sentia_network:
    external: true
    name: luna_sentia_network